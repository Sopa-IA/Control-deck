# Orbit Terminal · hp-agent · configuración de EJEMPLO
# Copia este archivo FUERA del repositorio, por ejemplo:
#   Windows: %APPDATA%\orbit\hp-agent.toml
#   Linux:   ~/.config/orbit/hp-agent.toml
# y rellena el token. NUNCA subas el archivo con el token real.

hub_url = "ws://10.0.0.2:8765/ws"   # orbitd en la Pi, cable interno
token = ""                             # lo escribe scripts/instalar-hp.ps1; no lo pongas en el repo
telemetry_period_s = 2.0
live = false                           # true solo con el instalador -Live: bloquear y apagar (60 s)

# Aplicaciones que hp.open_app puede abrir: identificador -> orden (lista de argumentos, sin shell).
[apps]
# navegador = ["C:\\Program Files\\Mozilla Firefox\\firefox.exe"]
# terminal  = ["wt.exe"]
